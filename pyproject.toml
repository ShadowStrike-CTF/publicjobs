[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "publicjobs"
version = "1.0.0"
description = "Australian public sector job board aggregator for DF/cyber/intel roles."
readme = "README.md"
license = { text = "Proprietary" }
authors = [{ name = "ShadowStrike", email = "r@strategos.au" }]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: Other/Proprietary License",
    "Operating System :: Microsoft :: Windows",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ShadowStrike-CTF/publicjobs"

# Internal files never ship in the sdist, even if the .gitignore guard is missing.
[tool.hatch.build.targets.sdist]
exclude = ["TEMPLATE_GUIDE.md", "CLAUDE.md", "CLAUDE.local.md"]
